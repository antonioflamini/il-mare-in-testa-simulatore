name: Controllo mensile dei listati ministeriali

on:
  schedule:
    - cron: "17 7 1 * *"   # il giorno 1 di ogni mese
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raccogli le novità sulle patenti nautiche
        run: |
          mkdir -p controllo
          : > controllo/nuovo.txt
          # 1) notizie degli ultimi 40 giorni su decreti, quiz ed esami della patente nautica
          curl -sSL --retry 3 -A "Mozilla/5.0" \
            "https://news.google.com/rss/search?q=%22patente+nautica%22+(decreto+OR+quiz+OR+esame+OR+D1)+when:40d&hl=it&gl=IT&ceid=IT:it" -o notizie.xml || true
          grep -oE '<title>[^<]+</title>' notizie.xml | sed -E 's#</?title>##g' | grep -viE '^"?patente nautica' \
            | grep -iE 'decret|quiz|esam|D1|minister|motorizzazion|capitaneri|circolar|novit' | sed 's/^/NOTIZIA: /' >> controllo/nuovo.txt || true
          # 2) pagina normativa del Ministero (spesso blocca le richieste automatiche: se risponde, la usiamo)
          curl -sSL --retry 2 -A "Mozilla/5.0" "https://www.mit.gov.it/temi/patenti-mezzi-abilitazioni/patenti-nautiche/normativa" -o pagina.html || true
          grep -oiE 'href="[^"]+\.pdf"' pagina.html | sed 's/^/MIT: /' >> controllo/nuovo.txt || true
          sort -u controllo/nuovo.txt -o controllo/nuovo.txt
          echo "Righe raccolte: $(wc -l < controllo/nuovo.txt)"
      - name: Confronta con il controllo precedente
        id: diff
        run: |
          if [ ! -s controllo/nuovo.txt ]; then echo "stato=vuoto" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f controllo/elenco.txt ]; then
            comm -13 controllo/elenco.txt controllo/nuovo.txt | head -30 > controllo/novita.txt
            if [ -s controllo/novita.txt ]; then echo "stato=cambiato" >> "$GITHUB_OUTPUT"; else echo "stato=uguale" >> "$GITHUB_OUTPUT"; fi
          else
            echo "stato=primo" >> "$GITHUB_OUTPUT"
          fi
          mv controllo/nuovo.txt controllo/elenco.txt
      - name: Apri una segnalazione con le novità
        if: steps.diff.outputs.stato == 'cambiato'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "Novità trovate questo mese su decreti, quiz ed esami della patente nautica:"; echo; sed 's/^/- /' controllo/novita.txt; echo; echo "Se qualcuna riguarda nuovi quiz o modifiche agli elenchi (DD 131/2022, Elenco unico D1), il simulatore va aggiornato. Altrimenti chiudi questa segnalazione."; } > corpo.md
          gh issue create --title "Controllo mensile patenti nautiche ($(date +%Y-%m))" --body-file corpo.md
      - name: Avvisa se nessuna fonte risponde
        if: steps.diff.outputs.stato == 'vuoto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Controllo mensile: nessuna fonte raggiungibile ($(date +%Y-%m))" --body "Il controllo automatico non è riuscito a leggere né le notizie né la pagina del Ministero. Verifica a mano su mit.gov.it."
      - name: Salva l'elenco aggiornato
        if: steps.diff.outputs.stato != 'vuoto'
        run: |
          git config user.name "controllo-listati"
          git config user.email "actions@users.noreply.github.com"
          git add controllo/elenco.txt
          git diff --cached --quiet || git commit -m "Controllo mensile: $(date +%Y-%m-%d)"
          git push
